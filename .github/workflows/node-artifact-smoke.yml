name: Node installed-artifact smoke
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Direct public HTTPS URL for the reviewed tarball (no redirects)
        required: true
        type: string
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.3", "24.21.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Retrieve hash-pinned SDK tarball
        working-directory: js
        env:
          SDK_ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: node scripts/download-artifact.mjs
      - name: Clean artifact consumer gate
        working-directory: js
        env:
          SDK_ARTIFACT: ${{ github.workspace }}/js/artifacts/sdk.tgz
        run: npm run check:clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-node-${{ matrix.node }}
          path: js/reports/
