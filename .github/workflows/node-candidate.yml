name: Node release candidate installed consumers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.23.3" }
          - { os: ubuntu-latest, node: "24.21.0" }
          - { os: macos-latest, node: "24.21.0" }
          - { os: windows-latest, node: "24.21.0" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: checkpoint
        run: node js/scripts/source-checkpoint.mjs
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: shashikanth-gs/a2a-schema-contract-sdk
          ref: ${{ steps.checkpoint.outputs.sdk_revision }}
          path: .sdk-source
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: .sdk-source/js/package-lock.json
      - run: npm ci
        working-directory: .sdk-source/js
      - run: npm run build
        working-directory: .sdk-source/js
      - run: npm pack --ignore-scripts --pack-destination ../../js/artifacts
        working-directory: .sdk-source/js
      - run: npm run check:clean
        working-directory: js
        env:
          SDK_ARTIFACT: ${{ github.workspace }}/js/artifacts/a2a-schema-contract-0.1.0-rc.1.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-${{ matrix.os }}-${{ matrix.node }}
          path: js/reports/
          if-no-files-found: error
